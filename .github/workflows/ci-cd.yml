name: Build and Deploy

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: byte-app
  SECRET_NAME: byte-app/prod/database

jobs:

  # Run our Python tests
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        working-directory: app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: app
        run: pytest -v


  # Build the container and check it before pushing
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build test image
        working-directory: app
        run: docker build -t byte-app:test .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: byte-app:test
          format: table
          severity: "HIGH,CRITICAL"
          exit-code: "0"


  # Push an image only when code is pushed/merged to main
  push-image:
    runs-on: ubuntu-latest
    needs: [test, scan]

    if: github.event_name == 'push'

    outputs:
      image: ${{ steps.image-info.outputs.image }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: image-info
        run: |
          echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build image
        working-directory: app
        run: |
          docker build \
            -t ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .

      - name: Push image to ECR
        run: |
          docker push \
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


  # Deploy the image to both EC2 servers
  deploy:
    runs-on: ubuntu-latest
    needs: push-image
    environment: production
    steps:
      - name: Get the deployment scripts
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on both servers
        env:
          IMAGE: ${{ needs.push-image.outputs.image }}
          INSTANCE_1: ${{ secrets.EC2_INSTANCE_1 }}
          INSTANCE_2: ${{ secrets.EC2_INSTANCE_2 }}
        run: |
          python3 scripts/build_deploy_parameters.py \
            --output "$RUNNER_TEMP/deploy-parameters.json"

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_1" "$INSTANCE_2" \
            --document-name "AWS-RunShellScript" \
            --parameters "file://$RUNNER_TEMP/deploy-parameters.json" \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_1"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_2"

          echo "Deployment finished on both servers"


  # Last check is made through the load balancer
  health-check:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Check application through ALB
        run: |
          sleep 20
          curl --fail --retry 5 --retry-delay 10 \
            http://supernova-prod-alb-1036415004.ap-south-1.elb.amazonaws.com/health

          echo "Application is healthy through the load balancer"
