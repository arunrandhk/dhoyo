# Free demo hosting. Setup: docs/free-hosting.md
# Supply the Neon connection values in Render; keep credentials out of Git.
services:
  - type: web
    name: byte-ring-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /health
    # Use the Dockerfile CMD: start.sh initializes the database and runs Gunicorn.
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_PORT
        value: "5432"
      - key: PGSSLMODE
        value: require
      # One private signing key shared by every worker. Existing manually created
      # services must add AUTH_JWT_SECRET in Environment before deploying.
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "1"
      # Temporary testing bypass: remove or set to "0" after account tests.
      - key: AUTH_SKIP_EMAIL_ACTIVATION
        value: "1"
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Resend recovery email setup: docs/password-reset.md.
      # Existing services must add these manually in Render's Environment settings.
      - key: RESEND_API_KEY
        sync: false # Private API key created in Resend.
      - key: PASSWORD_RESET_FROM
        sync: false # Sender address on your verified Resend domain.
      - key: PASSWORD_RESET_BASE_URL
        sync: false # Public HTTPS app URL, for example https://your-domain/ring.
      - key: GOOGLE_CLIENT_ID
        value: "" # Optional Google web OAuth client ID; blank keeps Google sign-in disabled.
      # Optional Android/Play Games integration: docs/google-play-setup.md.
      # Add PLAY_GAMES_WEB_CLIENT_SECRET privately after creating a game-server credential.
      - key: ANDROID_PACKAGE_NAME
        value: com.dhoyo.app
